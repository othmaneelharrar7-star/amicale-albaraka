<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amicale Albaraka – Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2F8; --surface:#fff; --ink:#0A1F44; --muted:#51607A; --line:#D6DEEA; --track:#E3E9F2;
  --navy:#0B2A5E; --blue:#3B73C5; --blue-ink:#1B3F7A; --blue-soft:#E3ECFA;
  --good:#2F6B14; --good-fill:#5B9E31; --good-soft:#E6F2DD;
  --bad:#9C1118; --bad-fill:#D81E27; --bad-soft:#FDE3E4;
  --mute-soft:#E9EDF3;
  --shadow:0 6px 20px rgba(10,31,68,.07);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto}

header{position:sticky;top:0;z-index:5;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:44px;width:auto;border-radius:12px;background:#fff;flex:none}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.icon-btn{flex:none;width:44px;height:44px;border-radius:99px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.pills{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill-btn{flex:none;height:44px;padding:0 14px;border-radius:99px;border:0;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.pill-btn.add{background:transparent;border:1.5px dashed #7C8AA3;color:var(--blue-ink)}

main{padding:2px 16px 120px;display:flex;flex-direction:column;gap:10px}
.notice{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.notice[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:99px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;height:44px;padding:0 14px;border:0;border-radius:99px;background:transparent;color:#33435C;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:700}

.hero{background:var(--navy);color:#fff;border-radius:24px;padding:16px 18px}
.hero.ring{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:16px}
.hero .lbl{display:block;font-size:11px;font-weight:600;color:#C9D6EE}
.hero .big{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero .paid{color:#B9E892}.hero .rest{color:#FFC2C5}
.hero .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero .warn{font-size:12px;font-weight:600;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:6px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--navy);color:#fff}
.tile.red{background:#C81B23}
.tile b{font-size:21px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.tile small{font-size:12px;font-weight:600;color:#fff}
.tile .lbl{font-size:11px;font-weight:700;color:#fff}
.stackbar{display:flex;gap:3px;height:14px}
.stackbar span{border-radius:99px;min-width:4px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{flex:none;width:10px;height:10px;border-radius:3px}
.legend b{font-weight:700;white-space:nowrap}

.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.head h2{margin:0;font-size:15px;font-weight:800}
.btn{height:44px;padding:0 16px;border:0;border-radius:99px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.search{flex:1 1 140px;min-width:0;height:44px;border:1px solid #7C8AA3;border-radius:99px;padding:0 16px;background:var(--surface);font-size:14px}
select.search{flex:1 1 140px}

.card{width:100%;text-align:left;background:var(--surface);border:0;border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);display:block}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px}
.row.noav{grid-template-columns:1fr auto}
.rowbtn{width:100%;background:none;border:0;padding:0;text-align:left}
.av{width:40px;height:40px;border-radius:99px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.av.bad{background:var(--bad-soft);color:var(--bad)}
.mid{display:flex;flex-direction:column;gap:5px;min-width:0}
.t{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.t span{font-weight:500;color:var(--muted)}
.s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.bar{display:block;height:5px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good-fill);border-radius:99px}
.bar.bad i{background:var(--bad-fill)}
.two{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;flex-wrap:wrap}
.two .p{color:var(--good)}.two .r{color:var(--bad)}
.amt{font-size:17px;font-weight:800;letter-spacing:-.02em}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:5px 9px;border-radius:99px;white-space:nowrap;background:var(--mute-soft);color:#33435C}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--blue-soft);color:var(--blue-ink)}
.open{color:#2457A8;font-weight:700;font-size:12px}
.empty{background:var(--surface);border-radius:20px;padding:26px 16px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty p{margin:0 0 12px}
.phases{display:grid;grid-template-columns:minmax(90px,130px) 1fr 48px;align-items:center;gap:4px 8px;font-size:13px}
.phase{display:contents}
.phase-btn{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;background:none;border:0;padding:0;min-height:44px;text-align:left}
.phase-btn b{text-align:right;font-weight:800}
.phase-btn .bar{height:8px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{aspect-ratio:1/1;border:0;padding:0;border-radius:18px;overflow:hidden;background:#D5DEEC;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11px;font-weight:700;color:#fff;background:rgba(10,31,68,.72);text-align:left}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar div{pointer-events:auto;max-width:520px;margin:0 auto;height:64px;background:var(--ink);border-radius:32px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;box-shadow:0 12px 28px rgba(10,31,68,.28)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;color:#B8C6E0;font-size:11px;font-weight:600;text-decoration:none}
.tabbar a svg{width:20px;height:20px}
.tabbar a[aria-current="page"]{background:var(--blue);color:#fff;font-weight:700}

.overlay{position:fixed;inset:0;background:rgba(10,31,68,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay.over{z-index:11}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px 22px}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@media(min-width:620px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fields .full{grid-column:1/-1}
.fields input,.fields select,.fields textarea{color:var(--ink);font-weight:500;font-size:16px;background:var(--surface);border:1px solid #7C8AA3;border-radius:12px;padding:10px;width:100%;min-width:0}
.fields .check{flex-direction:row;align-items:center;gap:10px;min-height:44px;color:var(--ink)}
.fields .check input{width:22px;height:22px;flex:none}
.filebox{border:1.5px dashed #7C8AA3;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:12px 0 0}
.err:empty{display:none}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .sp{flex:1}
body.locked header,body.locked main,body.locked nav{display:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate[hidden]{display:none}
.gate form{width:100%;max-width:380px;background:var(--surface);border-radius:24px;padding:24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;text-align:center}
.gate img{width:150px;height:auto;margin:0 auto}
.gate h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.gate label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);text-align:left}
.gate input{height:48px;border:1px solid #7C8AA3;border-radius:12px;padding:0 12px;font-size:16px;background:var(--surface)}
.gate>p{color:var(--muted);text-align:center}
.linkbtn{background:none;border:0;color:#2457A8;font-weight:700;min-height:44px}
.backup{margin-top:8px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.backup p{flex:1 1 100%;margin:0;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--bg);border-radius:14px;padding:10px;min-width:0}
.kpi small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.kpi b{font-size:14px;font-weight:800;overflow-wrap:anywhere}
</style>
</head>

async function prepare(file){

    var b=await toJpeg(im,steps[i][0],steps[i][1]);

  if(!all.length)return h+emptyBox("Aucune facture ni dépense enregistrée pour ce projet.","factures","+ Ajouter une facture");
  all.forEach(function(f){
    var st=facStatus(f),m=n(f.montant),p=n(f.paye);
    var right=!(f.valP&&f.valT)?((f.valP?"":"Président ")+(f.valT?"":"Trésorier ")+"en attente"):(p>0&&p<m?"Reste "+dh(m-p):"");
    h+='<div class="card" role="button" tabindex="0" data-a="edit" data-col="factures" data-id="'+esc(f.id)+'"><div class="line"><span class="t">'+esc(f.fournisseur)+'</span>'+pill(st.t,st.c)+'</div><div class="s" style="margin:4px 0">'+esc([f.numero,f.poste,fdate(f.date)].filter(Boolean).join(" · "))+' '+fileLink(f,"Voir la facture")+'</div><div class="line" style="align-items:baseline"><span class="amt num" style="font-size:16px">'+dh(m)+'</span><span class="s" style="font-weight:600">'+esc(right)+'</span></div></div>';
  });
  return h;
}

/* ---------- Travaux ---------- */
function trvHTML(){
  var p=P(),ph=state.phases.filter(inScope).sort(function(a,b){return (n(a.ordre)||999)-(n(b.ordre)||999)||(a.createdAt||"").localeCompare(b.createdAt||"")});
  var av=ph.length?Math.round(ph.reduce(function(t,x){return t+Math.min(100,n(x.pct))},0)/ph.length):0;
  var budget=n(p.budget),payT=sum(state.factures.filter(inScope).filter(function(f){return POSTES_TRAVAUX.indexOf(f.poste)>=0}),"paye");
  var pp=pctOf(payT,budget);
  var h='<div class="hero ring">'+ring(av,"Avancement du chantier")+'<div class="col"><span class="lbl">Avancement du chantier</span>';
  if(budget>0){
    h+='<span style="font-size:15px;font-weight:700">Payé aux entreprises : <span class="num" style="color:'+(pp>av?"#FFC2C5":"#B9E892")+'">'+pp+' %</span></span>';
    if(pp>av)h+='<span class="warn">Paiements en avance de '+(pp-av)+' points sur les travaux</span>';
  }else h+='<span style="font-size:13px">Renseignez le marché travaux dans la fiche du projet pour comparer paiements et avancement.</span>';
  h+='</div></div>';
  h+='<div class="card stack" style="cursor:default"><div class="head"><h2>Phases</h2><button type="button" class="btn" data-a="new" data-col="phases">+ Phase</button></div>';
  if(!ph.length)h+='<p class="s" style="margin:0">Aucune phase définie.</p><div><button type="button" class="btn ghost" data-a="seed-phases">Ajouter les phases types</button></div>';
  else{
    h+='<div class="phases">';
    ph.forEach(function(x){var v=Math.min(100,n(x.pct));h+='<button type="button" class="phase-btn" data-a="edit" data-col="phases" data-id="'+esc(x.id)+'"><span style="font-weight:600">'+esc(x.nom)+'</span><span class="bar"><i style="width:'+v+'%"></i></span><b class="num">'+v+' %</b></button>'});
    h+='</div>';
  }
  h+='</div>';
  var j=state.journal.filter(inScope).sort(byDateDesc);
  h+='<div class="head"><h2>Journal du chantier ('+j.length+')</h2><button type="button" class="btn" data-a="new" data-col="journal">+ Photo ou rapport</button></div>';
  if(!j.length)return h+emptyBox("Aucune photo ni rapport pour le moment.","journal","+ Ajouter au journal");
  var ph2=j.filter(function(x){return x.fileId&&/^image\//.test(x.fileType||"")});
  if(ph2.length){
    h+='<div class="photos">';
    ph2.slice(0,6).forEach(function(x){h+='<button type="button" class="photo" data-a="edit" data-col="journal" data-id="'+esc(x.id)+'" aria-label="Photo du '+fdate(x.date)+'"><img '+imgSrc(x.fileId)+' alt="" loading="lazy"><span>'+fdate(x.date)+'</span></button>'});
    h+='</div>';
  }
  j.forEach(function(x){
    h+='<div class="card" role="button" tabindex="0" data-a="edit" data-col="journal" data-id="'+esc(x.id)+'"><div class="t">'+fdate(x.date)+(x.section?' <span>· '+esc(x.section)+'</span>':'')+'</div><div class="s" style="margin-top:4px">'+esc(x.note)+' '+fileLink(x)+'</div></div>';
  });
  return h;
}

/* ---------- Documents ---------- */
function scopeSeg(){
  var p=P();
  return '<div class="seg" role="group" aria-label="Type de documents"><button type="button" data-a="scope" data-id="projet" aria-pressed="'+(ui.scope==="projet")+'">'+esc(p?p.nom:"Projet")+'</button><button type="button" data-a="scope" data-id="asso" aria-pressed="'+(ui.scope==="asso")+'">Association</button></div>';
}
function docStatus(d){
  if(!d.expiration)return null;
  var k=days(d.expiration);
  if(k<0)return {c:"late",t:"Expiré"};
  if(k<=60)return {c:"late",t:k===0?"Expire aujourd'hui":"Expire dans "+k+" j"};
  return {c:"",t:"Jusqu'au "+fdate(d.expiration)};
}
function docHTML(){
  var p=P(),asso=ui.scope==="asso",pid=asso?"":p.id,cats=docCats(pid),q=ui.q.toLowerCase();
  var all=state.documents.filter(function(d){return (d.projet||"")===pid});
  var soon=all.filter(function(d){return d.expiration&&days(d.expiration)<=60});
  var h=scopeSeg();
  if(soon.length)h+='<div class="notice">'+soon.length+' document'+(soon.length>1?"s":"")+' à renouveler : '+esc(soon.map(function(d){return d.nom}).join(", "))+'.</div>';
  h+='<div class="head"><h2>'+(asso?"Documents de l'association":"Documents du projet")+' ('+all.length+')</h2><button type="button" class="btn" data-a="new" data-col="documents">+ Document</button></div>';
  if(!all.length)return h+emptyBox(asso?"Ajoutez les statuts, le récépissé, la liste du bureau, les PV…":"Ajoutez le titre foncier, l'autorisation de construire, les plans, les contrats…","documents","+ Ajouter un document");
  h+='<div class="head"><select class="search" id="f-dcat" aria-label="Catégorie">'+opts(cats,ui.dcat,"Toutes les catégories")+'</select><input type="search" class="search" id="f-q" placeholder="Rechercher" aria-label="Rechercher un document" value="'+esc(ui.q)+'"></div>';
  h+='<div class="stack" id="list">'+docRows(all,q)+'</div>';
  return h;
}
function docRows(all,q){
  var a=all.filter(function(d){return (!ui.dcat||d.categorie===ui.dcat)&&(!q||((d.nom||"")+" "+(d.note||"")).toLowerCase().indexOf(q)>=0)})
    .sort(function(x,y){return (x.categorie||"").localeCompare(y.categorie||"","fr")||(x.nom||"").localeCompare(y.nom||"","fr")}),h="";
  if(!a.length)return '<div class="empty">Aucun document ne correspond à ces filtres.</div>';
  a.forEach(function(d){var st=docStatus(d);
    h+='<div class="card" role="button" tabindex="0" data-a="edit" data-col="documents" data-id="'+esc(d.id)+'"><div class="line"><span class="t">'+esc(d.nom)+'</span>'+(st?pill(st.t,st.c):"")+'</div><div class="s" style="margin-top:4px">'+esc([d.categorie,fdate(d.date)].filter(Boolean).join(" · "))+' '+(d.fileId?fileLink(d):"Sans fichier")+'</div></div>';
  });
  return h;
}
function refreshList(){
  var el=$("#list");if(!el)return;
  if(ui.view==="adherents")el.innerHTML=adhRows(state.adherents.filter(inScope),ui.q.toLowerCase());
  else if(ui.view==="documents"){var pid=ui.scope==="asso"?"":P().id;el.innerHTML=docRows(state.documents.filter(function(d){return (d.projet||"")===pid}),ui.q.toLowerCase())}
}

/* ---------- form sheet ---------- */
function openSheet(col,id,adh){
  var sc=SCH[col],item=id?state[col].find(function(x){return x.id===id}):null,p=P();
  if(id&&!item)return;
  if(!item&&col!=="projets"&&!p&&!(col==="documents"&&ui.scope==="asso"))return;
  var ctx={projet:item?item.projet||"":(col==="documents"&&ui.scope==="asso"?"":(p?p.id:"")),adherentId:item?item.adherentId:(adh||detailId)};
  sheet={col:col,item:item,armed:false,ctx:ctx};
  $("#form-title").textContent=(item?"Modifier ":"Ajouter ")+sc.title;
  var h="";
  sc.fields.forEach(function(f){
    if(f.when&&!f.when())return;
    var v=item?item[f.k]:"";
    if(!item){
      if(f.k==="date"&&f.req)v=today();
      if(f.k==="section")v=ui.section;
      if(f.k==="sens")v=ui.chq;
      if(f.k==="tranche"&&col==="paiements"){var ad=state.adherents.find(function(x){return x.id===ctx.adherentId});if(ad)v=trancheOf(ad)+1}
    }
    if(v==null)v="";
    var id2="fld-"+f.k,c=f.full?' class="full"':"";
    if(f.t==="check"){h+='<label class="check full" for="'+id2+'"><input id="'+id2+'" name="'+f.k+'" type="checkbox"'+(v?" checked":"")+'>'+esc(f.l)+'</label>';return}
    h+='<label'+c+' for="'+id2+'">'+esc(f.l);
    if(f.t==="select"){var o=typeof f.o==="function"?f.o():f.o;h+='<select id="'+id2+'" name="'+f.k+'">'+opts(o,v||(f.k==="section"?"":(Array.isArray(o[0])?o[0][0]:o[0])))+'</select>'}
    else if(f.t==="area")h+='<textarea id="'+id2+'" name="'+f.k+'" rows="2">'+esc(v)+'</textarea>';
    else if(f.t==="number")h+='<input id="'+id2+'" name="'+f.k+'" type="number" inputmode="decimal" min="0"'+(f.max?' max="'+f.max+'"':"")+' step="any" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+'>';
    else h+='<input id="'+id2+'" name="'+f.k+'" type="'+f.t+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+'>';
    h+='</label>';
  });
  if(sc.file){
    h+='<div class="full filebox"><strong>'+esc(sc.file)+'</strong>';
    if(item&&item.fileId)h+='<span>'+fileLink(item,item.fileName||"Ouvrir le fichier")+'</span>';
    if(assets){
      h+='<label for="fld-file">'+(item&&item.fileId?"Remplacer par un autre fichier":"Photo, ou PDF de moins de 900 Ko")+'<input id="fld-file" name="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp,image/gif"></label>';
      if(item&&item.fileId)h+='<label class="check" for="fld-rm"><input id="fld-rm" name="rm" type="checkbox">Retirer le fichier</label>';
    }else h+='<span>L\'ajout de fichiers n\'est pas disponible dans cette vue.</span>';
    h+='</div>';
  }
  $("#form-fields").innerHTML=h;
  $("#form-err").textContent="";
  var del=$("#btn-del");del.hidden=!item;del.disabled=false;del.textContent="Supprimer";
  $("#btn-save").disabled=false;$("#btn-save").textContent="Enregistrer";
  $("#overlay").hidden=false;
}
function closeSheet(){$("#overlay").hidden=true;sheet=null}

async function submitForm(e){
  e.preventDefault();
  if(!sheet)return;
  var col=sheet.col,sc=SCH[col],old=sheet.item,form=$("#form"),err=$("#form-err"),data={};
  err.textContent="";
  for(var i=0;i<sc.fields.length;i++){
    var f=sc.fields[i],el=form.elements[f.k];
    if(!el){if(old&&old[f.k]!=null)data[f.k]=old[f.k];continue}
    if(f.t==="check"){data[f.k]=!!el.checked;continue}
    var raw=(el.value||"").trim();
    if(f.req&&!raw){err.textContent="Remplissez le champ « "+f.l+" ».";el.focus();return}
    if(f.t==="number"){
      if(!raw){data[f.k]=0;continue}
      var v=parseFloat(raw.replace(",","."));
      if(isNaN(v)||v<0||(f.max&&v>f.max)){err.textContent="« "+f.l+" » doit être un nombre"+(f.max?" entre 0 et "+f.max:" positif")+".";el.focus();return}
      data[f.k]=Math.round(v*100)/100;
    }else data[f.k]=raw;
  }
  if(col!=="projets")data.projet=sheet.ctx.projet;
  if(col==="paiements"){data.adherentId=sheet.ctx.adherentId||"";if(!data.adherentId){err.textContent="Ouvrez la fiche d'un adhérent pour ajouter un paiement.";return}}
  data.createdAt=old&&old.createdAt||new Date().toISOString();
  var fi=form.elements.file,file=fi&&fi.files&&fi.files[0],rm=form.elements.rm&&form.elements.rm.checked,toDelete=null;
  if(file&&!FILE_TYPES[file.type]){err.textContent="Format non accepté. Utilisez un PDF, JPG ou PNG.";return}
  var btn=$("#btn-save");btn.disabled=true;btn.textContent="Enregistrement…";
  try{
    if(sc.file){
      if(file&&assets){
        var up=await assets.upload(file);
        data.fileId=up.id;data.fileName=up.name||file.name;data.fileType=up.contentType||file.type;
        if(old&&old.fileId)toDelete=old.fileId;
      }else if(old&&old.fileId){
        if(rm)toDelete=old.fileId;else{data.fileId=old.fileId;data.fileName=old.fileName||"";data.fileType=old.fileType||""}
      }
    }
    var id=old?old.id:newId(col);
    await save(col,id,data);
    if(toDelete&&assets)assets.delete(toDelete).catch(function(){});
    if(col==="projets"&&!old){ui.projet=id;ui.section="";remember()}
    closeSheet();renderAll();
  }catch(ex){
    err.textContent=errMsg(ex);btn.disabled=false;btn.textContent="Enregistrer";
  }
}
async function deleteCurrent(){
  if(!sheet||!sheet.item)return;
  var del=$("#btn-del"),col=sheet.col,item=sheet.item,err=$("#form-err");
  if(col==="projets"){
    var used=COLS.some(function(c){return c!=="projets"&&state[c].some(function(x){return x.projet===item.id})});
    if(used){err.textContent="Ce projet contient encore des données (adhérents, chèques, factures…). Supprimez-les d'abord.";return}
  }
  if(!sheet.armed){sheet.armed=true;del.textContent="Confirmer la suppression";return}
  del.disabled=true;
  try{
    if(col==="adherents"){
      var pays=state.paiements.filter(function(p){return p.adherentId===item.id});
      for(var i=0;i<pays.length;i++){await remove("paiements",pays[i].id);if(pays[i].fileId&&assets)assets.delete(pays[i].fileId).catch(function(){})}
      closeDetail();
    }
    await remove(col,item.id);
    if(item.fileId&&assets)assets.delete(item.fileId).catch(function(){});
    closeSheet();renderAll();
  }catch(ex){err.textContent=errMsg(ex);del.disabled=false}
}
async function seedPhases(btn){
  var p=P();if(!p)return;
  btn.disabled=true;
  try{
    for(var i=0;i<PHASES_TYPES.length;i++)
      await save("phases",newId("phases"),{projet:p.id,section:ui.section,nom:PHASES_TYPES[i],pct:0,ordre:i+1,createdAt:new Date().toISOString()});
  }catch(ex){notice(errMsg(ex))}
  btn.disabled=false;
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(e.target.closest("[data-stop]"))return;
  var el=e.target.closest("[data-a]");
  if(!el){if(e.target.id==="overlay")closeSheet();else if(e.target.id==="detail")closeDetail();return}
  var a=el.dataset.a,id=el.dataset.id;
  if(a==="new")openSheet(el.dataset.col);
  else if(a==="edit")openSheet(el.dataset.col,id);
  else if(a==="edit-projet"){var p=P();if(p)openSheet("projets",p.id)}
  else if(a==="detail")openDetail(id);
  else if(a==="pay")openSheet("paiements",null,id);
  else if(a==="file"){e.preventDefault();openFile(el)}
  else if(a==="close-detail")closeDetail();
  else if(a==="close")closeSheet();
  else if(a==="delete")deleteCurrent();
  else if(a==="seed-phases")seedPhases(el);
  else if(a==="projet"){ui.projet=id;ui.section="";ui.q="";remember();renderAll()}
  else if(a==="section"){ui.section=id;remember();renderAll()}
  else if(a==="chq"){ui.chq=id;renderAll()}
  else if(a==="scope"){ui.scope=id;ui.q="";ui.dcat="";renderAll()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(sheet)closeSheet();else if(detailId)closeDetail()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('div[role="button"][data-a]')){e.preventDefault();e.target.click()}
});
document.addEventListener("input",function(e){
  var id=e.target.id;
  if(id==="f-q")ui.q=e.target.value;else if(id==="f-dcat")ui.dcat=e.target.value;else return;
  refreshList();
});
$("#form").addEventListener("submit",submitForm);
function authMsg(ex){
  var c=ex&&ex.code;
  if(c==="auth/network-request-failed")return "Pas de connexion internet.";
  if(c==="auth/too-many-requests")return "Trop d'essais. Réessayez dans quelques minutes.";
  if(c==="auth/user-disabled")return "Ce compte a été désactivé.";
  if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-email"||c==="auth/missing-password")return "Email ou mot de passe incorrect.";
  return "Connexion impossible. Réessayez.";
}
$("#login-form").addEventListener("submit",async function(e){
  e.preventDefault();
  var err=$("#lg-err"),btn=$("#lg-btn"),email=$("#lg-email").value.trim(),pw=$("#lg-pw").value;
  err.textContent="";
  if(!email||!pw){err.textContent="Saisissez votre email et votre mot de passe.";return}
  btn.disabled=true;btn.textContent="Connexion…";
  try{await signInWithEmailAndPassword(auth,email,pw);$("#lg-pw").value=""}
  catch(ex){err.textContent=authMsg(ex)}
  btn.disabled=false;btn.textContent="Se connecter";
});
$("#lg-reset").addEventListener("click",async function(){
  var err=$("#lg-err"),email=$("#lg-email").value.trim();
  if(!email){err.textContent="Saisissez d'abord votre email, puis appuyez de nouveau ici.";return}
  try{await sendPasswordResetEmail(auth,email);err.textContent="Si ce compte existe, un email pour changer le mot de passe vient d'être envoyé."}
  catch(ex){err.textContent=authMsg(ex)}
});
$("#logout").addEventListener("click",function(){signOut(auth).catch(function(){})});
function showOnly(w){
  $("#boot").hidden=w!=="boot";$("#login").hidden=w!=="login";
  document.body.classList.toggle("locked",w!=="app");$("#backup").hidden=w!=="app";
}
function route(){setView((location.hash||"#adherents").slice(1))}
window.addEventListener("hashchange",route);

/* ---------- start ---------- */
var DEFAULTS=[["casino1","Casino 1",""],["casino2","Casino 2",""],["valdor","Val d'Or","Appartements, Résidence 1, Résidence 2, Commerce"],["sidelabed","Sid El Abed",""]];
async function seedOnce(){
  try{
    var m=doc(fdb,PRE+"meta","init"),sn=await getDoc(m);
    if(sn.exists())return;
    for(var i=0;i<DEFAULTS.length;i++)
      await setDoc(doc(fdb,PRE+"projets",DEFAULTS[i][0]),{nom:DEFAULTS[i][1],sections:DEFAULTS[i][2],budget:0,ordre:i+1,createdAt:new Date().toISOString()});
    await setDoc(m,{at:new Date().toISOString()});
  }catch(e){}
}
function start(){
  try{var u0=JSON.parse(localStorage.getItem("amicale-albaraka-ui")||"null");if(u0){ui.projet=u0.projet||"";ui.section=u0.section||""}}catch(e){}
  if(!firebaseConfig||!firebaseConfig.apiKey||firebaseConfig.apiKey.indexOf("REMPLACER")===0){
    $("#boot-msg").textContent="Configuration Firebase manquante : remplissez le fichier firebase-config.js (voir LISEZMOI).";return;
  }
  var app=initializeApp(firebaseConfig);
  auth=getAuth(app);fdb=getFirestore(app);assets=fsAssets;
  onAuthStateChanged(auth,function(u){
    unsubs.forEach(function(f){f()});unsubs=[];
    if(!u){
      COLS.forEach(function(c){state[c]=[];loaded[c]=false});
      closeSheet();closeDetail();showOnly("login");return;
    }
    $("#who").textContent=u.email||"";
    notice("");showOnly("app");route();
    var seeded=false;
    COLS.forEach(function(col){
      unsubs.push(onSnapshot(collection(fdb,PRE+col),function(snap){
        state[col]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
        loaded[col]=true;
        if(col==="projets"&&!snap.metadata.fromCache&&!snap.docs.length&&!seeded){seeded=true;seedOnce()}
        renderAll();
      },function(){
        loaded[col]=true;
        notice("Les données ne sont pas accessibles. Vérifiez la connexion et vos droits d'accès.");
        renderAll();
      }));
    });
  });
}
start();
})();
